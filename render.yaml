services:
  - name: database-backup-job
    type: cron
    schedule: "0 6 * * *"
    region: oregon
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    autoDeploy: false
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: BUCKET_NAME
        sync: false
      - key: BUCKET_PREFIX
        sync: false
      - key: GCP_CREDENTIALS
        sync: false
      # Postgres version of your Postgres instance
      # For example, 14
      - key: POSTGRES_VERSION
        sync: false
      # Optional: comma-separated list of tables whose data should be skipped.
      # The schema is still dumped (only the rows are omitted), so restores stay
      # complete. Supports pg_dump patterns and schema qualification.
      # For example, "temp_*, public.audit_log, event_stream". Leave blank to back up everything.
      - key: EXCLUDE_TABLE_DATA
        sync: false

